<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Selected Work">
<title>Selected Work</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern><linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5eead4" stop-opacity=".9"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".45"/>
  <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>

<text x="2" y="52" class="mono" font-size="15" fill="#5eead4" letter-spacing="2">03</text>
<text x="44" y="56" class="serif" font-size="34" fill="#eef2f8">Selected Work</text>
<rect x="304" y="44" width="892" height="1.5" fill="url(#hfade)"/>

</svg>
