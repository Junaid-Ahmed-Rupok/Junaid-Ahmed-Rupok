<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="ReproHub: Re-runs a paper’s statistics on the raw data and checks whether its claims actually hold — not just whether p &lt; 0.05. 43 tests · docker · ci. python · scipy · streamlit">
