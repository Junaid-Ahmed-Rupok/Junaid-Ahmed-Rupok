<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="378" viewBox="0 0 1200 378" role="img" aria-label="Toolkit">
<title>Toolkit</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern></defs>
<rect x=".5" y=".5" width="1199" height="377" rx="20" fill="url(#cardbg)" stroke="#1f2d4d"/><text x="40" y="62" class="mono" font-size="12" letter-spacing="2" fill="#5eead4">ML &amp; DEEP LEARNING</text><rect x="250" y="44" width="82" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="291" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">PyTorch</text><rect x="340.51" y="44" width="105" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="393" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">TensorFlow</text><rect x="454.81" y="44" width="66" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="488" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">Keras</text><rect x="529.46" y="44" width="121" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="590" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">scikit-learn</text><rect x="659.62" y="44" width="82" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="700" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">XGBoost</text><rect x="750.13" y="44" width="89" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="795" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">LightGBM</text><rect x="848.5699999999999" y="44" width="89" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="893" y="62.7" text-anchor="middle" class="mono" font-size="13" fill="#5eead4">CatBoost</text><rect x="947.01" y="44" width="121" height="28" rx="14.0" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text x="1008" y="62.7" text-an