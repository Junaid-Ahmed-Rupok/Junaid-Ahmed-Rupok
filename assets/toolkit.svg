-opacity=".38"/><text x="424" y="328.7" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">Linux</text><rect x="466.02" y="310" width="82" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text x="507" y="328.7" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">Jupyter</text><rect x="556.53" y="310" width="97" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text x="605" y="328.7" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">Streamlit</text><rect x="662.9" y="310" width="66" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text x="696" y="328.7" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">LaTeX</text>
