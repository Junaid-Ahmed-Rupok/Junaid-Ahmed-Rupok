<svg xmlns="http://www.w3.org/2000/svg" width="190" height="50" viewBox="0 0 190 50" role="img" aria-label="Email">
<title>Email</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern></defs>
<rect x=".5" y=".5" width="189" height="49" rx="25" fill="#0d1528" stroke="#a78bfa" stroke-opacity=".55"/><rect x=".5" y=".5" width="189" height="49" rx="25" fill="#a78bfa" fill-opacity=".07"/><circle cx="30" cy="25" r="4" fill="#a78bfa"/><text x="103" y="30.5" text-anchor="middle" class="sans" font-weight="600" font-size="15.5" fill="#eef2f8">Email</text><text x="164" y="30.5" text-anchor="middle" class="sans" font-size="15" fill="#a78bfa">→</text>
</svg>
