<svg xmlns="http://www.w3.org/2000/svg" width="590" height="290" viewBox="0 0 590 290" role="img" aria-label="A-ICF: Five-phase causal-fairness audit for clinical ML. Reaches Equalized Odds Difference ≤ 0.055 on two clinical datasets and decomposes disparity into direct and spurious paths.">
<title>A-ICF: Five-phase causal-fairness audit for clinical ML. Reaches Equalized Odds Difference ≤ 0.055 on two clinical datasets and decomposes disparity into direct and spurious paths.</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern><radialGradient id="cg" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#5eead4" stop-opacity=".12"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs>

<rect x=".5" y=".5" width="589" height="289" rx="20" fill="url(#cardbg)" stroke="#1f2d4d"/>
<rect x=".5" y=".5" width="589" height="289" rx="20" fill="url(#cg)"/>
<rect x="34" y="0" width="56" height="3" rx="1.5" fill="#5eead4"/>
<text x="34" y="48" class="mono" font-size="12" letter-spacing="2.2" fill="#5eead4">CAUSAL FAIRNESS</text>
<rect x="420" y="30" width="136" height="26" rx="13" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".45"/>
<text x="488" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#5eead4">IEEE OMLET 2026</text>
<text x="33" y="92" class="serif" font-size="32" fill="#eef2f8">A-ICF</text>
<text x="556" y="92" text-anchor="end" class="sans" font-size="20" fill="#5b6b8a">↗</text>
<text x="34" y="116" class="sans" font-size="14" fill="#5b6b8a" letter-spacing=".3">Amortized Invariant Causal Fairness</text><text x="34" y="150" class="sans" font-size="15.5" fill="#8fa0bd">Five-phase causal-fairness audit for clinical ML. Reaches</text><text x="34" y="175" class="sans" font-size="15.5" fill="#8fa0bd">Equalized Odds Difference ≤ 0.055 on two clinical datasets</text><text x="34" y="200" class="sans" font-size="15.5" fill="#8fa0bd">and decomposes disparity into direct and spurious paths.</text><rect x="34" y="236" width="77" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="73" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">PyTorch</text><rect x="119.24000000000001" y="236" width="70" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="154" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">DCEVAE</text><rect x="197.16000000000003" y="236" width="143" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="269" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">Causal discovery</text>

</svg>
