<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Journey: tutoring 2019, YLRL 2022, independent research 2024, B.Sc. 2025, CAIR 2026">
