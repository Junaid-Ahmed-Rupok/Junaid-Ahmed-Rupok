<svg xmlns="http://www.w3.org/2000/svg" width="590" height="290" viewBox="0 0 590 290" role="img" aria-label="StatsPro: CSV in, full report out: 10 statistical tests with Benjamini–Hochberg FDR correction, plus an ML Studio with 6 models and live inference.">
<title>StatsPro: CSV in, full report out: 10 statistical tests with Benjamini–Hochberg FDR correction, plus an ML Studio with 6 models and live inference.</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
