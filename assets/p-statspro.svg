<text x="34" y="116" class="sans" font-size="14" fill="#5b6b8a" letter-spacing=".3">AI-powered statistical analysis platform</text><text x="34" y="150" class="sans" font-size="15.5" fill="#8fa0bd">CSV in, full report out: 10 statistical tests with</text><text x="34" y="175" class="sans" font-size="15.5" fill="#8fa0bd">Benjamini–Hochberg FDR correction, plus an ML Studio</text><text x="34" y="200" class="sans" font-size="15.5" fill="#8fa0bd">with 6 models and live inference.</text><rect x="34" y="236" width="92" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="80" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">Streamlit</text><rect x="133.88" y="236" width="77" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="172" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">XGBoost</text><rect x="219.12" y="236" width="85" height="26" rx="13.0" fill="#7dd3fc" fill-opacity=".09" stroke="#7dd3fc" stroke-opacity=".38"/><text x="261" y="253.3" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">CatBoost</text>

