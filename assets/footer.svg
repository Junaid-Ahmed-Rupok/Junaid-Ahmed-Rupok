<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Let's build machine learning you can trust.">
<title>Let's build machine learning you can trust.</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1424"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="fglow" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#5eead4" stop-opacity=".14"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs>

<rect width="1200" height="230" rx="22" fill="url(#fbg)"/>
<rect width="1200" height="230" rx="22" fill="url(#dots)"/>
<rect width="1200" height="230" rx="22" fill="url(#fglow)"/>
<rect x=".5" y=".5" width="1199" height="229" rx="22" fill="none" stroke="#1f2d4d"/>
<rect x="578" y="58" width="44" height="3" rx="1.5" fill="url(#accent)"/>
<text x="600" y="118" text-anchor="middle" class="serif" font-size="38" fill="#eef2f8">Let's build machine learning you can <tspan font-style="italic" fill="#5eead4">trust</tspan>.</text>
<text x="600" y="162" text-anchor="middle" class="mono" font-size="14" letter-spacing="1.5" fill="#8fa0bd">OPEN TO PH.D. SUPERVISION CONVERSATIONS &amp; RESEARCH COLLABORATIONS</text>

</svg>
