<svg xmlns="http://www.w3.org/2000/svg" width="590" height="150" viewBox="0 0 590 150" role="img" aria-label="1st Best Paper Award, SPECTRA 2026">
<title>1st Best Paper Award, SPECTRA 2026</title>
<style>
  .serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif} .sans{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .fade{animation:fadeUp .9s ease-out both}
  
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121f3a"/><stop offset="1" stop-color="#0d1528"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8fa0bd" opacity=".16"/>
  </pattern><radialGradient id="ag" cx="0" cy=".5" r=".8"><stop offset="0" stop-color="#fbbf24" stop-opacity=".12"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient></defs>

<rect x=".5" y=".5" width="589" height="149" rx="20" fill="url(#cardbg)" stroke="#fbbf24" stroke-opacity=".35"/>
<rect x=".5" y=".5" width="589" height="149" rx="20" fill="url(#ag)"/>
<circle cx="52" cy="75" r="30" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".5"/><path d="M41 61H63V72A11 11 0 0 1 41 72Z" fill="#fbbf24"/><path d="M41 64H35V69A6 6 0 0 0 42 75M63 64H69V69A6 6 0 0 1 62 75" fill="none" stroke="#fbbf24" stroke-width="2.2"/><rect x="50" y="82" width="4" height="6" fill="#fbbf24"/><rect x="43" y="88" width="18" height="4" rx="1.5" fill="#fbbf24"/>
