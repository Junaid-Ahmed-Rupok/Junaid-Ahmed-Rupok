xt x="850" y="127" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#eef2f8">Z</text><circle cx="1110" cy="120" r="27" fill="#0d1528" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 4"/><text x="1110" y="127" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#eef2f8">U</text><circle cx="850" cy="300" r="27" fill="#0d1528" stroke="#7dd3fc" stroke-width="1.8"/><text x="850" y="307" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#eef2f8">X</text><circle cx="980" cy="210" r="27" fill="#0d1528" stroke="#7dd3fc" stroke-width="1.8"/><text x="980" y="217" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#eef2f8">M</text><circle cx="1110" cy="300" r="37" fill="#5eead4" fill-opacity=".10" style="animation:glow 3s ease-in-out infinite"/><circle cx="1110" cy="300" r="27" fill="#0d1528" stroke="#7dd3fc" stroke-width="1.8"/><text x="1110" y="307" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#eef2f8">Y</text>
