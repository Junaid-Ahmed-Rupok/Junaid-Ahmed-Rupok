  <radialGradient id="glowB" cx=".12" cy="1" r=".55"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc" fill-opacity=".8"/></marker>
  <marker id="arrV" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa" fill-opacity=".8"/></marker></defs>

<rect width="1200" height="430" rx="22" fill="url(#herobg)"/>
